<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バイタル記録</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; background: #f0f4f8; color: #1a1a2e; font-size: 14px; }

/* ヘッダー */
header { background: #2c5f8a; color: #fff; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
header h1 { font-size: 16px; font-weight: 700; }
.date-nav { display: flex; align-items: center; gap: 6px; }
.date-nav button { background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 4px; padding: 4px 10px; font-size: 15px; cursor: pointer; }
.date-nav input[type=date] { border: none; border-radius: 4px; padding: 4px 8px; font-size: 13px; background: #fff; color: #1a1a2e; }

/* タブ */
.tabs { display: flex; background: #1e4a6e; }
.tabs button { flex: 1; padding: 10px; border: none; background: transparent; color: rgba(255,255,255,0.6); font-size: 13px; cursor: pointer; border-bottom: 3px solid transparent; }
.tabs button.active { color: #fff; border-bottom-color: #5cb8e4; font-weight: 700; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ===== 記録タブ ===== */
.record-area { padding: 12px; }
.resident-bar { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.resident-bar label { font-size: 12px; color: #555; font-weight: 600; white-space: nowrap; }
.resident-bar select { flex: 1; min-width: 150px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
.resident-bar button { padding: 8px 12px; background: #2c5f8a; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }

.card { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.card-title { font-size: 13px; font-weight: 700; color: #2c5f8a; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid #e8f0f8; }
.row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
.row label { font-size: 12px; color: #555; font-weight: 600; min-width: 58px; }
.row input[type=text], .row input[type=number], .row select, .row textarea {
  flex: 1; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: #fafafa; font-family: inherit;
}
.row input:focus, .row select:focus, .row textarea:focus { outline: none; border-color: #2c5f8a; background: #fff; }
.row textarea { resize: vertical; min-height: 68px; }
.unit { font-size: 12px; color: #888; white-space: nowrap; }
.jikan { display: flex; align-items: center; gap: 5px; flex: 1; }
.jikan input { width: 75px; flex: none; }
.jikan span { color: #888; }
.chk-group { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.chk-item { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.chk-item input { width: 16px; height: 16px; accent-color: #2c5f8a; cursor: pointer; }
.chk-item span { font-size: 13px; }
.saiken { background: #fff8e8; border: 1px solid #f0d080; border-radius: 6px; padding: 10px; margin-top: 8px; }
.saiken-label { font-size: 11px; color: #b8860b; font-weight: 700; margin-bottom: 6px; }

.save-bar { padding: 12px; position: sticky; bottom: 0; background: #f0f4f8; border-top: 1px solid #ddd; }
.save-btn { width: 100%; padding: 13px; background: #2c5f8a; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
.save-btn:disabled { background: #aaa; cursor: not-allowed; }

/* ===== 一覧タブ ===== */
.list-area { padding: 12px; }
.list-toolbar { background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.list-toolbar strong { font-size: 14px; color: #2c5f8a; }
.list-toolbar .cnt { font-size: 13px; color: #666; }
.print-btn { margin-left: auto; padding: 7px 14px; background: #1e4a6e; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
.filter-bar { background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-bar label { font-size: 12px; color: #555; font-weight: 600; }
.filter-bar select { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; background: #fff; }
.filter-bar .clear-btn { padding: 6px 10px; background: #eee; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; cursor: pointer; }

.table-wrap { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.vital-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 900px; }
.vital-table th { background: #2c5f8a; color: #fff; padding: 8px 8px; text-align: center; font-weight: 700; white-space: nowrap; position: sticky; top: 0; z-index: 5; }
.vital-table td { padding: 7px 8px; border-bottom: 1px solid #eee; text-align: center; white-space: nowrap; }
.vital-table tr:nth-child(even) td { background: #f7fafd; }
.vital-table tr:hover td { background: #e8f0f8; }
.vital-table .name-td { text-align: left; font-weight: 700; cursor: pointer; color: #1e4a6e; text-decoration: underline; }
.vital-table .yousu-td { text-align: left; white-space: normal; font-size: 11px; color: #444; min-width: 180px; max-width: 260px; line-height: 1.4; }
.ok { color: #27ae60; font-weight: 700; }
.alert { color: #e74c3c; font-weight: 700; }

/* ===== 利用者管理タブ ===== */
.manage-area { padding: 12px; }
.add-form { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.add-form h3 { font-size: 14px; font-weight: 700; color: #2c5f8a; margin-bottom: 10px; }
.add-form .form-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.add-form .form-row label { font-size: 12px; color: #555; font-weight: 600; min-width: 55px; }
.add-form .form-row input { flex: 1; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
.add-btn { width: 100%; padding: 10px; background: #27ae60; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }
.resident-list-box { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); overflow: hidden; }
.resident-list-box h3 { font-size: 14px; font-weight: 700; color: #2c5f8a; padding: 12px 14px; border-bottom: 1px solid #eee; }
.r-item { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #f0f0f0; gap: 10px; }
.r-item:last-child { border-bottom: none; }
.r-item .r-name { font-size: 14px; font-weight: 600; flex: 1; }
.r-item .r-date { font-size: 11px; color: #888; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
.badge-在籍 { background: #e8f8e8; color: #27ae60; }
.badge-退所 { background: #f8e8e8; color: #e74c3c; }
.taisho-btn { font-size: 11px; padding: 4px 8px; background: #e67e22; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
.delete-btn { font-size: 11px; padding: 4px 8px; background: #e74c3c; color: #fff; border: none; border-radius: 4px; cursor: pointer; }

/* toast */
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #27ae60; color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
.toast.show { opacity: 1; }
.toast.err { background: #e74c3c; }
.loading { text-align: center; padding: 30px; color: #888; font-size: 14px; }
.empty { text-align: center; padding: 30px; color: #aaa; font-size: 13px; }

/* ===== 印刷 ===== */
@media print {
  header, .tabs, .save-bar, .filter-bar, .list-toolbar .print-btn, .resident-bar { display: none !important; }
  body { background: #fff; font-size: 11px; }
  .tab-content { display: block !important; }
  #tab-record, #tab-manage { display: none !important; }
  .list-area { padding: 0; }
  .table-wrap { box-shadow: none; border-radius: 0; }
  .vital-table { min-width: unset; font-size: 10px; }
  .vital-table th { background: #333 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .list-toolbar { box-shadow: none; border-radius: 0; padding: 4px 0; }
  @page { size: A4 landscape; margin: 10mm; }
}
</style>
</head>
<body>

<header>
  <h1>📋 バイタル記録</h1>
  <div class="date-nav">
    <button onclick="changeDate(-1)">◀</button>
    <input type="date" id="dateInput" onchange="onDateChange()">
    <button onclick="changeDate(1)">▶</button>
  </div>
</header>

<div class="tabs">
  <button class="active" onclick="switchTab('record', this)">記録入力</button>
  <button onclick="switchTab('list', this)">一覧表示</button>
  <button onclick="switchTab('manage', this)">利用者管理</button>
</div>

<!-- 記録入力 -->
<div id="tab-record" class="tab-content active">
  <div class="record-area">
    <div class="resident-bar">
      <label>利用者</label>
      <select id="residentSel">
        <option value="">-- 選択してください --</option>
      </select>
      <button onclick="loadResidentVital()">📂 読込</button>
    </div>

    <div class="card">
      <div class="card-title">⏰ 利用時間・往診</div>
      <div class="row">
        <label>利用時間</label>
        <div class="jikan">
          <input type="text" id="jikan_s" placeholder="9:00">
          <span>〜</span>
          <input type="text" id="jikan_e" placeholder="16:00">
        </div>
      </div>
      <div class="row">
        <label>往診・その他</label>
        <input type="text" id="oushin" placeholder="往診・再検など">
      </div>
    </div>

    <div class="card">
      <div class="card-title">🌡️ バイタルサイン</div>
      <div class="row">
        <label>体温</label>
        <input type="number" id="taion" placeholder="36.5" step="0.1" min="34" max="42">
        <span class="unit">℃</span>
      </div>
      <div class="row">
        <label>血圧</label>
        <input type="text" id="ketsuatsu" placeholder="120/80">
        <span class="unit">mmHg</span>
      </div>
      <div class="row">
        <label>脈拍</label>
        <input type="number" id="myaku" placeholder="72">
        <span class="unit">回/分</span>
      </div>
      <div class="saiken">
        <div class="saiken-label">🔄 再検</div>
        <div class="row">
          <label>体温</label>
          <input type="number" id="r_taion" placeholder="再検値" step="0.1">
          <span class="unit">℃</span>
        </div>
        <div class="row">
          <label>血圧</label>
          <input type="text" id="r_ketsu" placeholder="再検値">
          <span class="unit">mmHg</span>
        </div>
        <div class="row">
          <label>脈拍</label>
          <input type="number" id="r_myaku" placeholder="再検値">
          <span class="unit">回/分</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🛁 ケア状況</div>
      <div class="row">
        <label>入浴</label>
        <div class="chk-group">
          <label class="chk-item"><input type="checkbox" id="nyuyoku"><span>入浴</span></label>
        </div>
      </div>
      <div class="row">
        <label>体操</label>
        <div class="chk-group">
          <label class="chk-item"><input type="checkbox" id="taiso_am"><span>AM</span></label>
          <label class="chk-item"><input type="checkbox" id="taiso_pm"><span>PM</span></label>
        </div>
      </div>
      <div class="row">
        <label>食事</label>
        <input type="text" id="shokuji" placeholder="全量・7割など">
      </div>
      <div class="row">
        <label>内服薬</label>
        <input type="text" id="naifuku" placeholder="服薬確認済など">
      </div>
      <div class="row">
        <label>外用薬</label>
        <input type="text" id="gaiyou" placeholder="軟膏塗布など">
      </div>
      <div class="row">
        <label>排便</label>
        <input type="text" id="haiben" placeholder="AM・PMなど">
      </div>
    </div>

    <div class="card">
      <div class="card-title">📝 一日の様子・記録</div>
      <div class="row">
        <label>様子</label>
        <textarea id="yousu" placeholder="一日の利用者様の様子を入力"></textarea>
      </div>
      <div class="row">
        <label>アクティビティ</label>
        <input type="text" id="activity" placeholder="塗り絵・脳トレなど">
      </div>
      <div class="row">
        <label>記入者</label>
        <input type="text" id="writer" placeholder="氏名">
      </div>
    </div>
  </div>
  <div class="save-bar">
    <button class="save-btn" id="saveBtn" onclick="saveVital()">💾 保存する</button>
  </div>
</div>

<!-- 一覧 -->
<div id="tab-list" class="tab-content">
  <div class="list-area">
    <div class="list-toolbar">
      <strong id="listDateLabel"></strong>
      <span class="cnt" id="listCnt"></span>
      <button class="print-btn" onclick="window.print()">🖨️ 印刷</button>
    </div>
    <div class="filter-bar">
      <label>利用者で絞込み：</label>
      <select id="filterResident" onchange="renderTable()">
        <option value="">全員</option>
      </select>
      <button class="clear-btn" onclick="document.getElementById('filterResident').value='';renderTable()">クリア</button>
    </div>
    <div class="table-wrap">
      <table class="vital-table">
        <thead>
          <tr>
            <th>氏名</th>
            <th>体温</th>
            <th>血圧</th>
            <th>脈拍</th>
            <th>再検体温</th>
            <th>再検血圧</th>
            <th>入浴</th>
            <th>体操</th>
            <th>食事</th>
            <th>内服薬</th>
            <th>外用薬</th>
            <th>排便</th>
            <th>一日の様子</th>
            <th>アクティビティ</th>
            <th>記入者</th>
          </tr>
        </thead>
        <tbody id="vitalTbody">
          <tr><td colspan="15" class="loading">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 利用者管理 -->
<div id="tab-manage" class="tab-content">
  <div class="manage-area">
    <div class="add-form">
      <h3>➕ 利用者追加</h3>
      <div class="form-row">
        <label>氏名</label>
        <input type="text" id="newName" placeholder="例：山田 花子様">
      </div>
      <button class="add-btn" onclick="addResident()">追加する</button>
    </div>
    <div class="resident-list-box">
      <h3>利用者一覧</h3>
      <div id="residentListArea"><div class="loading">読み込み中...</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw1zHlVcBn96IB9_YLsmCr3r6jpPpD9DJTNVDsp-dTi3IoNtE4SRawnXZ-ODukFQVhl/exec';

let residents = [];
let vitalCache = [];
let currentDate = new Date();

window.onload = () => {
  setDateInput(currentDate);
  loadResidents();
};

function setDateInput(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  document.getElementById('dateInput').value = `${y}-${m}-${dd}`;
}
function getDateStr() { return document.getElementById('dateInput').value; }

function changeDate(n) {
  currentDate.setDate(currentDate.getDate() + n);
  setDateInput(currentDate);
  const activeTab = document.querySelector('.tab-content.active');
  if (activeTab && activeTab.id === 'tab-list') loadVitals();
}
function onDateChange() {
  currentDate = new Date(document.getElementById('dateInput').value + 'T00:00:00');
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'list') loadVitals();
  if (name === 'manage') renderResidentList();
}

async function gas(params) {
  const url = GAS_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}

// ===== 利用者マスター =====
async function loadResidents() {
  try {
    const res = await gas({ action: 'getResidents' });
    residents = res.data || [];
    const active = residents.filter(r => r.status === '在籍');
    // 記録入力セレクト
    const sel = document.getElementById('residentSel');
    sel.innerHTML = '<option value="">-- 選択してください --</option>';
    active.forEach(r => {
      const o = document.createElement('option');
      o.value = r.id; o.textContent = r.name; sel.appendChild(o);
    });
    // 絞込みセレクト
    const fsel = document.getElementById('filterResident');
    fsel.innerHTML = '<option value="">全員</option>';
    active.forEach(r => {
      const o = document.createElement('option');
      o.value = r.name; o.textContent = r.name; fsel.appendChild(o);
    });
  } catch(e) { showToast('利用者読込エラー', true); }
}

function renderResidentList() {
  const area = document.getElementById('residentListArea');
  gas({ action: 'getResidents' }).then(res => {
    const all = res.data || [];
    if (!all.length) { area.innerHTML = '<div class="empty">利用者が登録されていません</div>'; return; }
    area.innerHTML = all.map(r => `
      <div class="r-item">
        <div>
          <div class="r-name">${r.name}</div>
          <div class="r-date">${r.taisho ? '退所：' + r.taisho : '在籍中'}</div>
        </div>
        <span class="badge badge-${r.status}">${r.status}</span>
        ${r.status === '在籍' ? `<button class="taisho-btn" onclick="taishoResident('${r.id}','${r.name}')">退所</button>` : ''}
        <button class="delete-btn" onclick="deleteResident('${r.id}','${r.name}')">削除</button>
      </div>`).join('');
  });
}

async function addResident() {
  const name = document.getElementById('newName').value.trim();
  if (!name) { showToast('氏名を入力してください', true); return; }
  await gas({ action: 'addResident', data: JSON.stringify({ name, nyusho: '' }) });
  document.getElementById('newName').value = '';
  showToast(name + ' を追加しました');
  loadResidents();
  renderResidentList();
}

async function taishoResident(id, name) {
  if (!confirm(name + ' を退所にしますか？')) return;
  await gas({ action: 'updateResidentStatus', data: JSON.stringify({ id, taisho: getDateStr(), status: '退所' }) });
  showToast(name + ' を退所にしました');
  loadResidents();
  renderResidentList();
}

async function deleteResident(id, name) {
  if (!confirm(name + ' を削除しますか？\n※この操作は取り消せません')) return;
  await gas({ action: 'deleteResident', data: JSON.stringify({ id }) });
  showToast(name + ' を削除しました');
  loadResidents();
  renderResidentList();
}

// ===== バイタル記録 =====
async function loadResidentVital() {
  const sel = document.getElementById('residentSel');
  if (!sel.value) { showToast('利用者を選択してください', true); return; }
  const name = sel.options[sel.selectedIndex].text;
  try {
    const res = await gas({ action: 'getVitals', date: getDateStr() });
    const r = (res.data || []).find(x => x.name === name);
    if (r) { fillForm(r); showToast('データを読み込みました'); }
    else { clearForm(); showToast('本日のデータなし（新規入力）'); }
  } catch(e) { showToast('読込エラー', true); }
}

function fillForm(r) {
  document.getElementById('jikan_s').value = r.jikan_start || '';
  document.getElementById('jikan_e').value = r.jikan_end || '';
  document.getElementById('oushin').value = r.oushin || '';
  document.getElementById('taion').value = r.taion || '';
  document.getElementById('ketsuatsu').value = r.ketsuatsu || '';
  document.getElementById('myaku').value = r.myaku || '';
  document.getElementById('r_taion').value = r.saiken_taion || '';
  document.getElementById('r_ketsu').value = r.saiken_ketsuatsu || '';
  document.getElementById('r_myaku').value = r.saiken_myaku || '';
  document.getElementById('nyuyoku').checked = r.nyuyoku === true || r.nyuyoku === 'TRUE';
  document.getElementById('taiso_am').checked = r.taiso_am === true || r.taiso_am === 'TRUE';
  document.getElementById('taiso_pm').checked = r.taiso_pm === true || r.taiso_pm === 'TRUE';
  document.getElementById('shokuji').value = r.shokuji || '';
  document.getElementById('naifuku').value = r.naifuku || '';
  document.getElementById('gaiyou').value = r.gaiyou || '';
  document.getElementById('haiben').value = r.haiben || '';
  document.getElementById('yousu').value = r.yousu || '';
  document.getElementById('activity').value = r.activity || '';
  document.getElementById('writer').value = r.writer || '';
}

function clearForm() {
  ['jikan_s','jikan_e','oushin','taion','ketsuatsu','myaku','r_taion','r_ketsu','r_myaku',
   'shokuji','naifuku','gaiyou','haiben','yousu','activity','writer'].forEach(id => {
    document.getElementById(id).value = '';
  });
  ['nyuyoku','taiso_am','taiso_pm'].forEach(id => document.getElementById(id).checked = false);
}

async function saveVital() {
  const sel = document.getElementById('residentSel');
  if (!sel.value) { showToast('利用者を選択してください', true); return; }
  const name = sel.options[sel.selectedIndex].text;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    const data = {
      date: getDateStr(), name,
      jikan_start: document.getElementById('jikan_s').value,
      jikan_end: document.getElementById('jikan_e').value,
      oushin: document.getElementById('oushin').value,
      taion: document.getElementById('taion').value,
      ketsuatsu: document.getElementById('ketsuatsu').value,
      myaku: document.getElementById('myaku').value,
      saiken_taion: document.getElementById('r_taion').value,
      saiken_ketsuatsu: document.getElementById('r_ketsu').value,
      saiken_myaku: document.getElementById('r_myaku').value,
      nyuyoku: document.getElementById('nyuyoku').checked,
      taiso_am: document.getElementById('taiso_am').checked,
      taiso_pm: document.getElementById('taiso_pm').checked,
      shokuji: document.getElementById('shokuji').value,
      naifuku: document.getElementById('naifuku').value,
      gaiyou: document.getElementById('gaiyou').value,
      haiben: document.getElementById('haiben').value,
      yousu: document.getElementById('yousu').value,
      activity: document.getElementById('activity').value,
      writer: document.getElementById('writer').value
    };
    await gas({ action: 'saveVital', data: JSON.stringify(data) });
    showToast('保存しました ✓');
  } catch(e) { showToast('保存エラー', true); }
  finally { btn.disabled = false; btn.textContent = '💾 保存する'; }
}

// ===== 一覧 =====
async function loadVitals() {
  const date = getDateStr();
  document.getElementById('listDateLabel').textContent = date;
  document.getElementById('vitalTbody').innerHTML = '<tr><td colspan="15" class="loading">読み込み中...</td></tr>';
  try {
    const res = await gas({ action: 'getVitals', date });
    vitalCache = res.data || [];
    renderTable();
  } catch(e) {
    document.getElementById('vitalTbody').innerHTML = '<tr><td colspan="15" class="empty">読込エラー</td></tr>';
  }
}

function renderTable() {
  const filter = document.getElementById('filterResident').value;
  const records = filter ? vitalCache.filter(r => r.name === filter) : vitalCache;
  document.getElementById('listCnt').textContent = records.length + '名';
  const tbody = document.getElementById('vitalTbody');
  if (!records.length) {
    tbody.innerHTML = '<tr><td colspan="15" class="empty">この日の記録はありません</td></tr>';
    return;
  }
  tbody.innerHTML = records.map(r => {
    const taionNum = parseFloat(r.taion);
    const taionCls = taionNum >= 37.5 ? 'alert' : '';
    const nyuClass = (r.nyuyoku === true || r.nyuyoku === 'TRUE') ? 'ok' : '';
    const nyu = (r.nyuyoku === true || r.nyuyoku === 'TRUE') ? '○' : '―';
    const taiso = [
      (r.taiso_am === true || r.taiso_am === 'TRUE') ? 'AM' : '',
      (r.taiso_pm === true || r.taiso_pm === 'TRUE') ? 'PM' : ''
    ].filter(Boolean).join(' ') || '―';
    return `<tr>
      <td class="name-td" onclick="jumpToEdit('${r.name}')">${r.name}</td>
      <td class="${taionCls}">${r.taion ? r.taion + '℃' : '―'}</td>
      <td>${r.ketsuatsu || '―'}</td>
      <td>${r.myaku ? r.myaku + '/分' : '―'}</td>
      <td>${r.saiken_taion ? r.saiken_taion + '℃' : '―'}</td>
      <td>${r.saiken_ketsuatsu || '―'}</td>
      <td class="${nyuClass}">${nyu}</td>
      <td>${taiso}</td>
      <td>${r.shokuji || '―'}</td>
      <td>${r.naifuku || '―'}</td>
      <td>${r.gaiyou || '―'}</td>
      <td>${r.haiben || '―'}</td>
      <td class="yousu-td">${r.yousu || '―'}</td>
      <td>${r.activity || '―'}</td>
      <td>${r.writer || '―'}</td>
    </tr>`;
  }).join('');
}

function jumpToEdit(name) {
  // 記録タブへ移動して該当利用者を選択
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-record').classList.add('active');
  document.querySelectorAll('.tabs button')[0].classList.add('active');
  const sel = document.getElementById('residentSel');
  for (let i = 0; i < sel.options.length; i++) {
    if (sel.options[i].text === name) { sel.selectedIndex = i; break; }
  }
  loadResidentVital();
}

// ===== Toast =====
function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => t.className = 'toast', 2500);
}
</script>
